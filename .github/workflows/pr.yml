name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci'
    # Pinned, not @master (fork rule, doc/CI-FORK-DRIFT.md).
    #
    # This caller decides which version of paperclipai/paperclip's reusable
    # workflow runs; @master silently swaps in a newer CI definition than the
    # one this tree was written for, and every fork PR then goes red on jobs
    # the PR never touched (HIS-3521).
    #
    # The pinned SHA is the upstream release this branch is built on
    # (v2026.1106.0), whose .github/workflows/pr-trusted.yml is byte-identical
    # to the copy in this tree. Bump it only together with a rebase of the
    # patch branch onto that upstream commit, never on its own.
    uses: paperclipai/paperclip/.github/workflows/pr-trusted.yml@d69631b01b9c658f80bf8bed389863dce82643e1
